# Relais vidéo de TwitchUnblock sur un VPS (README, « Video relay »).
#
# Dans un dossier, avec le Caddyfile à côté et un fichier .env :
#   RELAY_DOMAIN=monrelais.duckdns.org     (nom qui pointe vers le VPS)
#
# Serveur web déjà en place sur les ports 80/443 (Caddy, nginx…) :
#   docker compose up -d
#   puis faire suivre RELAY_DOMAIN vers 127.0.0.1:8788 (README).
# Ports 80/443 libres : le Caddy fourni s'occupe de l'HTTPS (certificat
# Let's Encrypt automatique) :
#   docker compose --profile caddy up -d
#
# Mise à jour : docker compose pull && docker compose up -d
# (avec --profile caddy si on s'en sert).
#
# Le relais tourne dans l'image du site (même worker.js).
services:
  relay:
    image: ghcr.io/mxfia19/twitchunblock-web:${TAG:-latest}
    entrypoint: ["node", "/app/relay.mjs"]
    restart: unless-stopped
    # Un petit init en premier processus : il transmet l'arrêt (docker stop)
    # et ramasse les processus finis. Santé : HEALTHCHECK de l'image
    # (/health, bot Discord compris), visible dans « docker ps ».
    init: true
    # Durcissement : aucun programme du conteneur ne peut gagner de droits
    # (programmes setuid comme mount ou su) et aucune capacité Linux n'est
    # gardée ; le relais n'en a besoin d'aucune (utilisateur node, port
    # 8788). Pas pour Caddy plus bas, qui écoute sur les ports 80 et 443.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Joignable depuis le VPS seulement : c'est le serveur web qui le publie.
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      # RELAY_DOMAIN obligatoire (.env) : sans lui, chaque requête finissait
      # en 502, sans un mot dans le journal.
      PUBLIC_ORIGIN: "https://${RELAY_DOMAIN:?set RELAY_DOMAIN in the .env file (README, Video relay)}"
      # Sites qui peuvent s'en servir (les autres sont refusés) : le site
      # officiel (nouvelle et ancienne adresse) et ses aperçus de test sur
      # Vercel. Remplaçable par ALLOWED_ORIGINS=… dans le fichier .env.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-https://twitchunblock.vercel.app,https://test2-fawn-eta.vercel.app,https://twitchunblock-*-mxfia19s-projects.vercel.app,https://test2-*-mxfia19s-projects.vercel.app}"
      # Worker dont le relais publie les notifications ntfy de l'app iOS
      # (ntfy.sh refuse les adresses de Cloudflare). Vide = coupé.
      NTFY_WORKER: "${NTFY_WORKER-https://test2.kurzmathis4.workers.dev}"
      # Bot Discord (README, « Discord bot ») : jeton du bot,
      # secret partagé avec le Worker (FEEDBACK_BOT_SECRET, même valeur),
      # Worker des retours, autres comptes Discord autorisés à répondre.
      # Sans jeton, coupé.
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN-}"
      FEEDBACK_BOT_SECRET: "${FEEDBACK_BOT_SECRET-}"
      FEEDBACK_WORKER: "${FEEDBACK_WORKER-https://test2.kurzmathis4.workers.dev}"
      DISCORD_ADMIN_IDS: "${DISCORD_ADMIN_IDS-}"
      # Facultatif : Workers de secours surveillés (séparés par des virgules ;
      # vide = celui de l'instance officielle), heure et fuseau du résumé du
      # matin (9 h, Europe/Paris).
      FALLBACK_WORKERS: "${FALLBACK_WORKERS-}"
      SUMMARY_TZ: "${SUMMARY_TZ-}"
      SUMMARY_HOUR: "${SUMMARY_HOUR-}"
      # Facultatif : quotas gratuits de Cloudflare surveillés par le bot (jeton
      # en lecture seule « Account Analytics: Read » et compte du Worker).
      # Vides = coupé (README, « Discord bot »).
      CLOUDFLARE_API_TOKEN: "${CLOUDFLARE_API_TOKEN-}"
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID-}"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [relay]
    ports:
      - "80:80"
      - "443:443"
    environment:
      RELAY_DOMAIN: "${RELAY_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy-data:
  caddy-config:
