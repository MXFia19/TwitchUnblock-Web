# Auto-hébergement : ce fichier suffit, pas besoin de cloner le dépôt.
#   docker compose up -d                           puis http://localhost:8787
#   docker compose pull && docker compose up -d    pour mettre à jour
# L'image est construite par GitHub à chaque mise à jour du site (branche
# main) et publiée sur ghcr.io : rien à compiler chez soi. Depuis un clone du
# dépôt, on peut la construire soi-même avec `build: .` à la place de `image:`.
services:
  twitchunblock:
    image: ghcr.io/mxfia19/twitchunblock-web:latest
    container_name: twitchunblock
    restart: unless-stopped
    # Un petit init en premier processus : il transmet l'arrêt (docker stop)
    # et ramasse les processus finis de wrangler. Santé : HEALTHCHECK de
    # l'image, visible dans « docker ps ».
    init: true
    ports:
      - "8787:8787"
    volumes:
      - twitchunblock-data:/data
    environment:
      # Adresse publique du site (sans / final). Sert à l'adresse de retour
      # de la connexion Twitch et aux origines acceptées pour le comptage.
      PUBLIC_URL: "http://localhost:8787"
      # Connexion Twitch (facultatif) : crée une application sur
      # https://dev.twitch.tv/console avec PUBLIC_URL/ comme adresse de retour.
      TWITCH_CLIENT_ID: ""
      # Ton identifiant Twitch, pour les outils développeur de /stats.
      # Vide : personne n'y a accès.
      ADMIN_TWITCH_IDS: ""
      # "1" seulement derrière ton propre mandataire (Caddy, nginx…) qui ajoute
      # l'adresse du visiteur à X-Forwarded-For : les limites la comptent.
      # Vide : l'adresse de la connexion (README, Docker).
      TRUST_PROXY: ""
      # Sites qui peuvent lire la vidéo par ton instance depuis un navigateur
      # (/api/proxy), séparés par des virgules ; les autres reçoivent 403.
      # Vide : le tien (PUBLIC_URL) et le site officiel (« Worker personnel »
      # de ses réglages) ; "*" : tout le monde. Les apps ne sont pas touchées.
      ALLOWED_ORIGINS: ""
    # Journaux bornés à 3 × 10 Mo : sans cela, ils grandissent sans fin.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  twitchunblock-data:
