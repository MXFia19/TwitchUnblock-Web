# App TV LG (dossier webos/) : une coquille webOS qui ouvre le site hébergé
# en mode TV (?tv=webos, voir public/assets/js/tv.js). Vérifie appinfo.json
# et les icônes, fabrique le paquet .ipk avec ares-package (@webos-tools/cli)
# et le garde en artefact. Sur main, il est aussi publié dans la release
# « webos-v<version> », comme l'extension Connect (extension.yml), mais jamais
# marquée « dernière » : le site envoie vers …/releases/latest pour
# l'extension. La même version republiée remplace son paquet.
name: webOS app

on:
  push:
    branches:
      - main
      - test-17d298
    paths:
      - 'webos/**'
      - '.github/workflows/webos.yml'
  workflow_dispatch:

concurrency:
  group: webos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Champs obligatoires, version x.y.z (sans zéro devant), page de départ
      # présente, icônes PNG de 80 × 80 et 130 × 130.
      - name: Check appinfo.json
        run: |
          node - <<'EOF'
          const fs = require('fs')
          const fail = (msg) => { console.log(`::error file=webos/appinfo.json::${msg}`); process.exit(1) }
          const info = JSON.parse(fs.readFileSync('webos/appinfo.json', 'utf8'))
          for (const k of ['id', 'version', 'type', 'main', 'title', 'icon', 'largeIcon']) if (!info[k]) fail(`champ ${k} manquant`)
          if (info.type !== 'web') fail('type doit valoir web')
          if (!/^(0|[1-9]\d{0,8})(\.(0|[1-9]\d{0,8})){2}$/.test(info.version)) fail(`version ${info.version} : trois nombres sans zéro devant`)
          if (!fs.existsSync(`webos/${info.main}`)) fail(`${info.main} absent`)
          for (const [k, size] of [['icon', 80], ['largeIcon', 130]]) {
            const png = fs.readFileSync(`webos/${info[k]}`)
            const w = png.readUInt32BE(16)
            const h = png.readUInt32BE(20)
            if (png.toString('latin1', 1, 4) !== 'PNG' || w !== size || h !== size) fail(`${info[k]} : PNG de ${size} × ${size} attendu (${w} × ${h})`)
          }
          console.log(`${info.id} ${info.version} : OK`)
          EOF

      # Version exacte, à monter à la main (comme wrangler dans le Dockerfile).
      - name: Install webOS CLI
        run: npm install --global --no-audit --no-fund @webos-tools/cli@3.2.6

      - name: Package
        id: package
        run: |
          version=$(node -p 'require("./webos/appinfo.json").version')
          name="twitchunblock-webos-$version"
          ares-package --check webos
          mkdir -p dist
          ares-package webos --outdir dist
          ipk=$(ls dist/*.ipk)
          ares-package --info "$ipk"
          mv "$ipk" "dist/$name.ipk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}.ipk
          if-no-files-found: error

  # Sur main seulement : release « webos-v<version> » avec un paquet à nom
  # fixe (twitchunblock-webos.ipk) et un mot vers le README pour installer.
  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./webos/appinfo.json").version')
          tag="webos-v$version"
          src="dist/twitchunblock-webos-$version/twitchunblock-webos-$version.ipk"
          test -f "$src"
          cp "$src" twitchunblock-webos.ipk
          notes="TwitchUnblock for LG TVs (webOS 22 or newer): a small app that opens the website in TV mode. Install it with Developer Mode (ares-install) or on a rooted TV: https://github.com/${GITHUB_REPOSITORY}#lg-tv-webos"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" twitchunblock-webos.ipk --clobber
          else
            gh release create "$tag" twitchunblock-webos.ipk --title "TwitchUnblock for LG TV $version" \
              --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
