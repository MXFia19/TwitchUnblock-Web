# Extension de navigateur TwitchUnblock Connect (dossier extension/) :
# vérifie les JSON et la syntaxe des JS, lance le banc d'essai (API chrome et
# Twitch simulés, sans réseau), puis produit les paquets Chrome et Firefox,
# gardés en artefacts. Sur main, ils sont aussi publiés dans la release
# « connect-v<version> » (la dernière), téléchargeables sans compte GitHub.
# La signature Firefox (AMO) et les boutiques restent manuelles.
name: Extension

on:
  push:
    branches:
      - main
      - test-17d298
    paths:
      - 'extension/**'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Check and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Valid JSON
        run: |
          find extension -name '*.json' -print0 | while IFS= read -r -d '' f; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f" || { echo "::error file=$f::JSON invalide"; exit 1; }
          done

      - name: JavaScript syntax
        run: |
          find extension \( -name '*.js' -o -name '*.mjs' \) -print0 | while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::syntaxe invalide"; exit 1; }
          done

      - name: Test bench
        run: node extension/tests/run.mjs

      # Le dossier préparé est envoyé tel quel : GitHub en fait l'archive, que l'on
      # télécharge sous le nom twitchunblock-connect-<version>.zip, manifest.json à
      # la racine (prête pour « Charger l'extension non empaquetée » une fois
      # décompressée). Envoyer un .zip donnerait un zip dans un zip. La version
      # Firefox (manifeste adapté, dev/build-firefox.mjs) part à côté, en
      # twitchunblock-connect-<version>-firefox (module temporaire, ou AMO).
      - name: Package
        id: package
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          name="twitchunblock-connect-$version"
          mkdir -p "dist/$name"
          tar -C extension --exclude=./tests --exclude=./dev -cf - . | tar -C "dist/$name" -xf -
          (cd "dist/$name" && find . -type f | sort)
          test -f "dist/$name/manifest.json"
          if [ -e "dist/$name/tests" ] || [ -e "dist/$name/dev" ]; then
            echo "::error::fichiers de dev dans le paquet"; exit 1
          fi
          node extension/dev/build-firefox.mjs
          mv extension-firefox "dist/$name-firefox"
          node -e 'const m = require(process.argv[1]); if (!m.background.scripts || !m.browser_specific_settings) process.exit(1)' "./dist/$name-firefox/manifest.json"
          if [ -e "dist/$name-firefox/tests" ] || [ -e "dist/$name-firefox/dev" ]; then
            echo "::error::fichiers de dev dans le paquet Firefox"; exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/${{ steps.package.outputs.name }}/
          if-no-files-found: error

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}-firefox
          path: dist/${{ steps.package.outputs.name }}-firefox/
          if-no-files-found: error

  # Sur main seulement : release « connect-v<version> », marquée la dernière,
  # avec deux zips à nom fixe (liens stables …/releases/latest/download/…) et
  # les étapes d'installation en anglais (extension/INSTALL.md) pour texte.
  # La même version republiée remplace ses zips. Le site renvoie vers
  # …/releases/latest (connect.js, INSTALL_URL).
  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          name="twitchunblock-connect-$version"
          tag="connect-v$version"
          test -f "dist/$name/manifest.json"
          test -f "dist/$name-firefox/manifest.json"
          (cd "dist/$name" && zip -qr ../../twitchunblock-connect-chrome.zip .)
          (cd "dist/$name-firefox" && zip -qr ../../twitchunblock-connect-firefox.zip .)
          files="twitchunblock-connect-chrome.zip twitchunblock-connect-firefox.zip"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
            gh release edit "$tag" --notes-file extension/INSTALL.md --latest
          else
            gh release create "$tag" $files --title "TwitchUnblock Connect $version" \
              --notes-file extension/INSTALL.md --target "$GITHUB_SHA" --latest
          fi
