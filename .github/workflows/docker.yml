# Image Docker publiée sur ghcr.io à chaque mise à jour du site. Avant, chaque
# auto-hébergeur reconstruisait l'image chez lui (`docker compose build
# --no-cache`) ; il n'a plus qu'à la télécharger :
#   docker compose pull && docker compose up -d
#
#   main         → ghcr.io/mxfia19/twitchunblock-web:latest
#   test-17d298  → ghcr.io/mxfia19/twitchunblock-web:test
#
# amd64 et arm64 : PC et serveurs, mais aussi Raspberry Pi et Mac Apple Silicon.
name: Docker image

on:
  push:
    branches:
      - main
      - test-17d298
    # Seulement si le contenu de l'image change : un README ou le
    # docker-compose.yml ne la reconstruisent pas.
    paths:
      - 'worker.js'
      - 'public/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# Deux poussées rapprochées sur la même branche : la construction en cours est
# annulée, la plus récente publie. Sans ceci, la plus lente pouvait finir en
# dernier et remettre l'ancien code sous « latest » (le relais le récupère).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # En minuscules : ghcr.io refuse les majuscules du nom de compte.
  IMAGE: ghcr.io/mxfia19/twitchunblock-web

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Émulation arm64 pour construire les deux architectures sur la même machine.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étiquettes de l'image, et ses métadonnées (dont le lien vers ce dépôt,
      # qui rattache le paquet ghcr.io au dépôt sur GitHub).
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test-17d298' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache des couches entre deux builds : seules celles qui changent
          # (site, Worker) sont refaites.
          cache-from: type=gha
          cache-to: type=gha,mode=max
