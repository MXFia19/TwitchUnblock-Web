# Image Docker publiée sur ghcr.io à chaque mise à jour du site. Avant, chaque
# auto-hébergeur reconstruisait l'image chez lui (`docker compose build
# --no-cache`) ; il n'a plus qu'à la télécharger :
#   docker compose pull && docker compose up -d
#
#   main         → ghcr.io/mxfia19/twitchunblock-web:latest
#   test-17d298  → ghcr.io/mxfia19/twitchunblock-web:test
#
# amd64 et arm64 : PC et serveurs, mais aussi Raspberry Pi et Mac Apple Silicon.
name: Docker image

on:
  push:
    branches:
      - main
      - test-17d298
    # Seulement si le contenu de l'image change : un README ou le
    # docker-compose.yml ne la reconstruisent pas.
    paths:
      - 'worker.js'
      - 'public/**'
      - 'docker/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

# Deux poussées rapprochées sur la même branche : la construction en cours est
# annulée, la plus récente publie. Sans ceci, la plus lente pouvait finir en
# dernier et remettre l'ancien code sous « latest » (le relais le récupère).
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # En minuscules : ghcr.io refuse les majuscules du nom de compte.
  IMAGE: ghcr.io/mxfia19/twitchunblock-web

jobs:
  # Le site annonce la dernière version de l'extension TwitchUnblock Connect
  # (CONNECT_LATEST, public/assets/js/connect.js) : elle doit valoir celle de
  # extension/manifest.json (vérifié aussi par le workflow « Extension »).
  # Job à part : un écart le signale sans bloquer l'image.
  connect-version:
    name: Connect version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: CONNECT_LATEST matches the extension
        run: node extension/dev/check-site-version.mjs

  image:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Émulation arm64 pour construire les deux architectures sur la même machine.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étiquettes de l'image, et ses métadonnées (dont le lien vers ce dépôt,
      # qui rattache le paquet ghcr.io au dépôt sur GitHub).
      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=test,enable=${{ github.ref == 'refs/heads/test-17d298' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Commit et branche de la construction : le relais les donne sur
          # /health, et son bot prévient quand le VPS a du retard (Dockerfile).
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          # Cache des couches entre deux builds : seules celles qui changent
          # (site, Worker) sont refaites.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Essai de l'image publiée (amd64), avec les options des docker-compose
      # (no-new-privileges, aucune capacité) : le site et son Worker
      # répondent, le relais aussi, et aucun gestionnaire de paquets n'est
      # resté. Une image qui ne démarre plus (base, wrangler…) passe ici en
      # rouge, sur la branche de test avant main.
      - name: Smoke test (amd64)
        run: |
          img="$IMAGE:sha-${GITHUB_SHA::7}"
          opts="--init --security-opt no-new-privileges:true --cap-drop ALL"
          docker run -d --name site $opts -p 8787:8787 "$img"
          docker run -d --name relay $opts -p 8788:8788 -e PUBLIC_ORIGIN=https://relay.example.com \
            --entrypoint node "$img" /app/relay.mjs
          ok=""
          for i in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8787/ \
              && curl -fsS -o /dev/null http://127.0.0.1:8787/api/ping \
              && curl -fsS -o /dev/null http://127.0.0.1:8788/health; then
              ok=1; break
            fi
            sleep 3
          done
          docker logs site 2>&1 | tail -30
          docker logs relay 2>&1 | tail -15
          if [ -z "$ok" ]; then echo "::error::L'image ne répond pas (site, Worker ou relais)."; exit 1; fi
          if docker exec site sh -c 'command -v npm || command -v npx || command -v corepack || command -v yarn'; then
            echo "::error::Un gestionnaire de paquets est resté dans l'image."; exit 1
          fi
          echo "Site, Worker et relais répondent ; npm, corepack et yarn sont absents."
