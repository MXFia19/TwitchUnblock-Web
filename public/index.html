<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TwitchUnblock">
  <meta name="description" content="Regarder les lives et VODs Twitch sans abonnement, avec le chat.">
  <title>TwitchUnblock</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239146ff'/%3E%3Cpath d='M9 7h16v10l-4 4h-4l-3 3v-3h-5z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M15 11v4m5-4v4' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Thème choisi (Réglages → Apparence), posé avant le premier affichage :
    // sinon la page s'affiche un instant en sombre avant de passer au clair.
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('tu_prefs') || '{}')
        var bg = p.themeBg || 'dark'
        if (bg === 'auto') bg = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.bg = bg
        if (p.themeAccent && p.themeAccent !== 'twitch') document.documentElement.dataset.accent = p.themeAccent
        // Barre de titre de l'app installée et barre du navigateur : la
        // couleur du fond (mêmes valeurs que BG_COLORS dans main.js).
        var colors = { dark: '#0e0e10', oled: '#000000', slate: '#0f141c', light: '#f3f3f6' }
        var tc = document.querySelector('meta[name="theme-color"]')
        if (tc && colors[bg]) tc.setAttribute('content', colors[bg])
        var cs = document.querySelector('meta[name="color-scheme"]')
        if (cs) cs.setAttribute('content', bg === 'light' ? 'light' : 'dark')
      } catch (e) {}
    })()
  </script>
  <!-- Chemins absolus : la page est aussi servie sous /xqc, /videos/123… -->
  <link rel="stylesheet" href="/assets/styles.css">

  <script>
    // Retour de la connexion Twitch. Doit tourner avant tout le reste : dans
    // la popup, on transmet le jeton à la fenêtre d'origine puis on se ferme.
    // Sans popup (mobile, popup bloquée), on le range, et l'adresse redevient
    // celle de la page d'où l'on était parti (rangée par login() dans
    // main.js) : le direct ou la VOD en cours n'est plus perdu.
    (function () {
      var hash = location.hash
      var query = new URLSearchParams(location.search)
      var fromHash = new URLSearchParams(hash.slice(1))
      var popup = window.opener && window.opener !== window
      // `state` : jeton remis seulement s'il répond à NOTRE demande de
      // connexion. Sans ce contrôle, n'importe quel site pouvait envoyer
      // vers « …/#access_token=<son jeton> » et connecter le visiteur à un
      // autre compte (où partaient ensuite son historique et ses messages).
      var expected = null
      try { expected = localStorage.getItem('tu_oauth_state') } catch (e) {}
      var back = function () {
        var p = null
        try { p = sessionStorage.getItem('tu_login_back'); sessionStorage.removeItem('tu_login_back') } catch (e) {}
        return p && p.charAt(0) === '/' && p.charAt(1) !== '/' && p.indexOf('\\') === -1 ? p : null
      }
      // Autorisation refusée sur Twitch : retour avec « ?error=access_denied »
      // et sans jeton. La popup restait ouverte sur une 2e copie du site.
      var failed = query.get('error') ? query : fromHash.get('error') ? fromHash : null
      if (failed) {
        var mine = Boolean(expected) && failed.get('state') === expected
        if (mine) { try { localStorage.removeItem('tu_oauth_state') } catch (e) {} }
        if (mine && popup) {
          try { window.opener.postMessage('tu-login-cancelled', location.origin) } catch (e) {}
          window.close()
          return
        }
        query.delete('error'); query.delete('error_description'); query.delete('state')
        var rest = query.toString()
        var cancelledBack = mine ? back() : null
        if (mine) { try { sessionStorage.setItem('tu_login_cancelled', '1') } catch (e) {} }
        history.replaceState(null, '', cancelledBack || location.pathname + (rest ? '?' + rest : ''))
        return
      }
      if (hash.indexOf('access_token=') === -1) return
      var token = fromHash.get('access_token')
      history.replaceState(null, '', location.pathname + location.search)
      if (!token) return
      if (!expected || fromHash.get('state') !== expected) return
      if (popup) {
        try { window.opener.postMessage(hash, location.origin) } catch (e) {}
        window.close()
        return
      }
      try { localStorage.removeItem('tu_oauth_state'); localStorage.setItem('twitch_token', token) } catch (e) {}
      var loginBack = back()
      if (loginBack) history.replaceState(null, '', loginBack)
    })()
  </script>
  <script src="/config.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
</head>
<body>
  <div class="app">
    <!-- ── Barre du haut ─────────────────────────────────────────────── -->
    <header class="topbar">
      <a class="brand" href="/" data-tab="discover" aria-label="TwitchUnblock">
        <span class="brand-mark" data-icon="twitch" data-size="20"></span>
        <span class="brand-name">Twitch<b>Unblock</b></span>
      </a>
      <nav class="nav" aria-label="Navigation">
        <button type="button" data-tab="discover" class="active"><span data-icon="compass" data-size="18"></span><span data-i18n="nav_discover"></span></button>
        <button type="button" data-tab="categories"><span data-icon="layers" data-size="18"></span><span data-i18n="nav_categories"></span></button>
        <button type="button" data-tab="channel"><span data-icon="user" data-size="18"></span><span data-i18n="nav_channel"></span></button>
        <button type="button" data-tab="link"><span data-icon="link" data-size="18"></span><span data-i18n="nav_link"></span></button>
      </nav>
      <div class="topbar-actions">
        <!-- Bug ou idée : en vue sur toutes les pages, avec son texte sur grand écran. -->
        <button class="feedback-btn" type="button" data-action="feedback" data-i18n-title="feedback"><span data-icon="bug" data-size="17"></span><span class="feedback-btn-label" data-i18n="feedback_short"></span></button>
        <button class="icon-btn" type="button" data-action="settings" data-i18n-title="settings" data-icon="settings"></button>
        <button class="account-btn" id="account-btn" type="button" data-action="login"></button>
      </div>
    </header>

    <main class="content">
      <!-- ── Découvrir ─────────────────────────────────────────────── -->
      <section class="view" id="view-discover">
        <div id="announcement" hidden></div>
        <section class="block" id="continue-block" hidden>
          <div class="block-head"><h2><span data-icon="history" data-size="18"></span><span data-i18n="continue_watching"></span></h2></div>
          <div class="rail" id="continue-rail"></div>
        </section>

        <div class="segmented home-tabs" id="home-seg">
          <button type="button" data-home="followed" data-i18n="home_followed"></button>
          <button type="button" data-home="top" data-i18n="top"></button>
          <button type="button" data-home="offline" data-i18n="offline_channels"></button>
        </div>

        <section class="block" id="followed-block">
          <div class="block-head">
            <h2><span data-icon="heart" data-size="18"></span><span data-i18n="followed"></span></h2>
            <span class="block-tools">
              <button class="icon-btn sm" type="button" data-action="toggle-layout" id="layout-toggle"></button>
              <button class="icon-btn sm" type="button" data-action="refresh-discover" data-i18n-title="refresh" data-icon="refresh" data-size="18"></button>
            </span>
          </div>
          <div class="grid" id="followed-grid"></div>
        </section>

        <!-- Chaînes suivies hors ligne : leur propre onglet, pour que
             « Suivies » ne montre que ce qui est en direct. -->
        <section class="block" id="offline-block" hidden>
          <div class="block-head">
            <h2><span data-icon="clock" data-size="18"></span><span data-i18n="offline_channels"></span><small class="muted" id="offline-count"></small></h2>
            <span class="block-tools">
              <button class="icon-btn sm" type="button" data-action="refresh-discover" data-i18n-title="refresh" data-icon="refresh" data-size="18"></button>
            </span>
          </div>
          <div id="followed-offline"></div>
        </section>

        <section class="block" id="top-block">
          <div class="block-head">
            <h2><span data-icon="flame" data-size="18"></span><span data-i18n="top"></span></h2>
            <div class="segmented" id="top-seg">
              <button type="button" data-lang="local" class="active" id="top-local"></button>
              <button type="button" data-lang="all" data-i18n="top_world"></button>
            </div>
          </div>
          <div class="grid" id="top-grid"></div>
          <div class="load-more" id="top-more"></div>
          <!-- « N masqués ici · Gérer » (chaînes et catégories masquées) -->
          <div class="hidden-foot" id="top-hidden"></div>
        </section>
      </section>

      <!-- ── Catégories ────────────────────────────────────────────── -->
      <section class="view" id="view-categories" hidden>
        <div id="cat-browser">
          <div class="block-head">
            <div class="segmented" id="cat-seg">
              <button type="button" data-cat-tab="followed" data-i18n="cat_followed"></button>
              <button type="button" data-cat-tab="all" class="active" data-i18n="cat_all"></button>
            </div>
            <label class="filter" id="cat-search-wrap"><span data-icon="search" data-size="16"></span><input id="cat-search" type="search" autocomplete="off" data-i18n-ph="cat_search_ph"></label>
          </div>
          <div class="cat-grid" id="cat-grid"></div>
          <div class="load-more" id="cat-more"></div>
          <div class="hidden-foot" id="cat-hidden"></div>
        </div>
        <div id="cat-detail" hidden></div>
      </section>

      <!-- ── Streamer ──────────────────────────────────────────────── -->
      <section class="view" id="view-channel" hidden>
        <form class="search" id="channel-form" autocomplete="off" role="search">
          <span class="search-icon" data-icon="search" data-size="18"></span>
          <input id="channel-input" type="search" enterkeyhint="search" data-i18n-ph="search_channel_ph" autocapitalize="off" spellcheck="false">
          <button class="btn primary" type="submit"><span data-i18n="search"></span></button>
          <div class="suggest" id="channel-suggest" hidden></div>
        </form>
        <div class="recent" id="recent-channels" hidden>
          <div class="recent-head">
            <span class="muted" data-i18n="recent_channels"></span>
            <button class="link-btn" type="button" data-action="clear-channels" data-i18n="clear_all"></button>
          </div>
          <div class="chips" id="recent-list"></div>
        </div>
        <div id="channel-result"></div>
      </section>

      <!-- ── Lien / ID ─────────────────────────────────────────────── -->
      <section class="view" id="view-link" hidden>
        <div class="link-card">
          <div class="link-card-icon" data-icon="film" data-size="28"></div>
          <h2 data-i18n="link_title"></h2>
          <p class="muted" data-i18n="link_desc"></p>
          <form class="search" id="link-form" autocomplete="off">
            <span class="search-icon" data-icon="link" data-size="18"></span>
            <input id="link-input" type="text" inputmode="url" enterkeyhint="go" data-i18n-ph="link_ph" autocapitalize="off" spellcheck="false">
            <button class="btn primary" type="submit"><span data-i18n="link_open"></span></button>
          </form>
        </div>
      </section>

      <footer class="site-footer">
        <span>TwitchUnblock · <span data-i18n="made_by"></span> <a href="https://github.com/MXFia19" target="_blank" rel="noopener">MXFia19</a></span>
        <a href="https://github.com/MXFia19/TwitchUnblock-Web" target="_blank" rel="noopener"><span data-icon="github" data-size="15"></span>GitHub</a>
        <a href="https://discord.gg/cEsMRdxsVq" target="_blank" rel="noopener"><span data-icon="discord" data-size="15"></span>Discord</a>
        <span data-i18n="not_affiliated"></span>
      </footer>
    </main>

    <!-- ── Barre d'onglets (mobile) ──────────────────────────────────── -->
    <nav class="tabbar" aria-label="Navigation">
      <button type="button" data-tab="discover" class="active"><span data-icon="compass" data-size="22"></span><span data-i18n="nav_discover"></span></button>
      <button type="button" data-tab="categories"><span data-icon="layers" data-size="22"></span><span data-i18n="nav_categories"></span></button>
      <button type="button" data-tab="channel"><span data-icon="user" data-size="22"></span><span data-i18n="nav_channel"></span></button>
      <button type="button" data-tab="link"><span data-icon="link" data-size="22"></span><span data-i18n="nav_link"></span></button>
    </nav>
  </div>

  <!-- ── Lecteur (surimpression plein écran, réductible) ─────────────── -->
  <div class="watch" id="watch" hidden>
    <header class="watch-head">
      <button class="icon-btn" type="button" data-action="watch-minimize" data-i18n-title="minimize" data-icon="chevronDown" data-size="22"></button>
      <img class="avatar sm" id="watch-avatar" alt="" hidden>
      <div class="watch-id">
        <strong id="watch-title"></strong>
        <div class="watch-sub" id="watch-sub"></div>
      </div>
      <button class="icon-btn" type="button" data-action="watch-close" data-i18n-title="close" data-icon="x" data-size="22"></button>
    </header>
    <div class="watch-body" id="watch-body">
      <div class="watch-video">
        <div id="player"></div>
        <div class="watch-loading" id="watch-loading"><span class="spinner"></span></div>
        <div class="watch-ended" id="watch-ended"></div>
        <div class="watch-error">
          <span data-icon="radio" data-size="30"></span>
          <p id="watch-error-text"></p>
          <button class="btn" type="button" data-action="watch-retry" data-icon="refresh" data-size="16"><span data-i18n="refresh"></span></button>
          <button class="btn ghost sm" type="button" data-action="feedback-bug" data-icon="bug" data-size="15"><span data-i18n="report_problem"></span></button>
        </div>
      </div>
      <div class="watch-info" id="watch-info"></div>
      <aside class="watch-chat" id="chat"></aside>
    </div>
    <div class="watch-mini">
      <div class="mini-text"><strong id="mini-title"></strong></div>
      <button class="icon-btn sm mini-play" type="button" data-action="watch-toggle-play">
        <span class="when-paused" data-icon="play" data-size="20"></span>
        <span class="when-playing" data-icon="pause" data-size="20"></span>
      </button>
      <button class="icon-btn sm" type="button" data-action="watch-expand" data-i18n-title="fullscreen" data-icon="chevronUp" data-size="20"></button>
      <button class="icon-btn sm" type="button" data-action="watch-close" data-i18n-title="close" data-icon="x" data-size="20"></button>
    </div>
  </div>

  <!-- ── Multi-live : sélection (barre du bas) et mosaïque ───────────── -->
  <div class="multi-bar" id="multi-bar" hidden>
    <span class="mb-icon" data-icon="grid" data-size="18"></span>
    <span class="mb-count" id="multi-count"></span>
    <div class="mb-list" id="multi-bar-list"></div>
    <button class="btn primary sm" type="button" data-action="multi-open"><span data-icon="play" data-size="15"></span><span data-i18n="multi_watch"></span></button>
    <button class="icon-btn sm" type="button" data-action="multi-clear" data-i18n-title="multi_clear" data-icon="x" data-size="18"></button>
  </div>
  <div class="multi" id="multi" hidden>
    <header class="multi-head">
      <span class="multi-logo" data-icon="grid" data-size="20"></span>
      <strong data-i18n="multi_title"></strong>
      <span class="multi-hint" data-i18n="multi_hint"></span>
      <form class="multi-add" id="multi-add-form" autocomplete="off">
        <input type="text" id="multi-add-input" data-i18n-ph="multi_add_ph" maxlength="120" enterkeyhint="go" spellcheck="false" autocapitalize="off" autocorrect="off">
        <button class="icon-btn sm" type="submit" data-i18n-title="multi_add" data-icon="plus" data-size="18"></button>
      </form>
      <button class="icon-btn multi-chat-btn" type="button" data-action="multi-chat" data-i18n-title="multi_chat" data-icon="chat" data-size="20"></button>
      <button class="icon-btn" type="button" data-action="multi-share" data-i18n-title="multi_share" data-icon="link" data-size="20"></button>
      <button class="icon-btn" type="button" data-action="multi-close" data-i18n-title="close" data-icon="x" data-size="22"></button>
    </header>
    <div class="multi-body">
      <div class="multi-grid" id="multi-grid"></div>
      <aside class="multi-chat" id="multi-chat"></aside>
    </div>
  </div>

  <!-- ── Feuille (réglages, ouvrir dans…) ────────────────────────────── -->
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
</body>
</html>
