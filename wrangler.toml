name = "test2"
main = "worker.js"
compatibility_date = "2024-01-01"
# Variables posées dans le tableau de bord Cloudflare (FEEDBACK_WEBHOOK,
# SITE_ORIGINS, ADMIN_TWITCH_IDS…) : sans ceci, chaque déploiement depuis
# `main` effaçait celles de type « Texte » (les « Secrets », eux, restent).
keep_vars = true

# Notifications de live du site (Web Push) : un passage par minute (lives lus
# une minute sur deux, envois à chaque fois).
[triggers]
crons = ["* * * * *"]

# Notifications ntfy de l'app iOS : publiées par le relais du VPS, ntfy.sh
# refusant les adresses partagées des Workers (worker.js, NTFY_RELAY). Le
# relais n'accepte que les lots signés par la clé push de ce Worker.
#
# Administrateur des outils de /stats (compte mxfia19) : le Worker n'en a
# plus aucun par défaut. Une autre valeur posée dans le tableau de bord est
# remplacée par celle-ci : ajouter ici les autres identifiants. Pour son
# propre Worker, mettre le sien.
[vars]
NTFY_RELAY = "https://relais.mxfia19.duckdns.org"
ADMIN_TWITCH_IDS = "839837720"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Base D1 : tout le stockage (sauvegardes, comptage, annonces, réactions).
# La table est créée par le Worker au premier appel (CREATE TABLE IF NOT EXISTS).
[[d1_databases]]
binding = "DB"
database_name = "twitchunblock"
database_id = "b586defd-3216-425b-9c13-e75abd8dbd13"

# Worker de secours, sur un AUTRE compte Cloudflare : le quota gratuit
# (100 000 requêtes par jour) est par compte. Déployé sous le nom
# « test2-fallback » avec `npx wrangler deploy --env fallback`.
# Sans base D1 — un environnement n'hérite pas des liaisons — : il ne sert que
# ce qui n'en dépend pas (lives, VODs, relais vidéo, Moobot). Voir README,
# « Fallback Worker ».
[env.fallback]
workers_dev = true

# Un environnement n'hérite pas non plus des variables.
[env.fallback.vars]
ADMIN_TWITCH_IDS = "839837720"

# Le secours n'a pas de base : pas de tâche planifiée.
[env.fallback.triggers]
crons = []
