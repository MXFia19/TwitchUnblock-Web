name = "test2"
main = "worker.js"
compatibility_date = "2024-01-01"
# Variables posées dans le tableau de bord Cloudflare (FEEDBACK_WEBHOOK,
# SITE_ORIGINS, ADMIN_TWITCH_IDS…) : sans ceci, chaque déploiement depuis
# `main` effaçait celles de type « Texte » (les « Secrets », eux, restent).
keep_vars = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# Base D1 : tout le stockage (sauvegardes, comptage, annonces, réactions).
# La table est créée par le Worker au premier appel (CREATE TABLE IF NOT EXISTS).
[[d1_databases]]
binding = "DB"
database_name = "twitchunblock"
database_id = "b586defd-3216-425b-9c13-e75abd8dbd13"

# Worker de secours, sur un AUTRE compte Cloudflare : le quota gratuit
# (100 000 requêtes par jour) est par compte. Déployé sous le nom
# « test2-fallback » avec `npx wrangler deploy --env fallback`.
# Sans base D1 — un environnement n'hérite pas des liaisons — : il ne sert que
# ce qui n'en dépend pas (lives, VODs, relais vidéo, Moobot). Voir README,
# « Fallback Worker ».
[env.fallback]
workers_dev = true
